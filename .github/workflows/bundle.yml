name: Portable skill bundle
on:
  push:
  pull_request:

jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Manifest, metadata, references and temporary-HOME installers
        shell: bash
        run: python -m unittest discover -s tests -v
